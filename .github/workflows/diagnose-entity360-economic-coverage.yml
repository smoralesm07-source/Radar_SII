name: Diagnóstico cobertura económica Entity 360

on:
  push:
    branches: ['diag/entity360-sii-economic-coverage']
    paths:
      - '.github/workflows/diagnose-entity360-economic-coverage.yml'
  workflow_dispatch:
    inputs:
      entity_ids:
        description: 'Entity IDs separados por coma'
        required: false
        default: 'ENT-RUT-76112852-3,ENT-RUT-76395643-1,ENT-RUT-76118067-3'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENTITY_IDS: ${{ inputs.entity_ids || 'ENT-RUT-76112852-3,ENT-RUT-76395643-1,ENT-RUT-76118067-3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'duckdb>=1.3,<2' pandas numpy
      - name: Descargar bundle público Radar SII
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o radar-sii-fusion-profile.zip \
            https://github.com/smoralesm07-source/Radar_SII/releases/download/fusion-v1/radar-sii-fusion-profile.zip
          unzip -j radar-sii-fusion-profile.zip entity_search.parquet public_transport_manifest.json -d bundle
          ls -lh bundle
      - name: Consultar RUT objetivo
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          import duckdb

          ids = [x.strip() for x in os.environ['ENTITY_IDS'].split(',') if x.strip()]
          con = duckdb.connect()
          cols = con.execute("describe select * from read_parquet('bundle/entity_search.parquet')").fetchall()
          print('COLUMNS=' + json.dumps([c[0] for c in cols], ensure_ascii=False))
          placeholders = ','.join(['?'] * len(ids))
          query = f'''
            select *
            from read_parquet('bundle/entity_search.parquet')
            where entity_id in ({placeholders})
            order by entity_id
          '''
          rows = con.execute(query, ids).fetchdf()
          print('MATCH_COUNT=' + str(len(rows)))
          for rec in rows.to_dict(orient='records'):
              keep = {k: rec.get(k) for k in [
                  'entity_id','rut','legal_name','commercial_year','sales_band','sales_band_code',
                  'sales_band_rank','workers_numeric','region','province','commune','economic_sector',
                  'economic_subsector','main_activity','taxpayer_type','taxpayer_subtype',
                  'activity_start_date','termination_date','current_status','activity_count',
                  'activity_codes','activity_names','address_count','current_address_count'
              ] if k in rec}
              for k,v in list(keep.items()):
                  try:
                      if hasattr(v, 'isoformat'): keep[k] = v.isoformat()
                      elif str(v) == '<NA>': keep[k] = None
                  except Exception:
                      pass
              print('ENTITY=' + json.dumps(keep, ensure_ascii=False, default=str))
          print('MANIFEST=' + open('bundle/public_transport_manifest.json', encoding='utf-8').read().replace('\n',' '))
          PY
