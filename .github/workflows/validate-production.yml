name: Validate Radar SII v0.1.1 Canonical
on:
  push:
    branches: [release/v0.1.1-canonical]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt && python -m pip install -e .
      - name: Full official-source build
        run: python -m radar_sii.pipeline --output validation_output
      - name: Assert production acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          coverage=json.loads(Path('validation_output/coverage.json').read_text())
          quality=json.loads(Path('validation_output/quality.json').read_text())
          src=quality['company_year_source']
          canonical=quality['company_year']
          assert coverage['history_complete'] is True, coverage
          assert coverage['company_years'] == [2020,2021,2022,2023,2024], coverage
          assert src['source_rows'] > 4_000_000, src
          assert src['canonical_rows'] > 4_000_000, src
          assert src['stable_payload_conflict_groups'] == 0, src
          assert src['canonical_duplicate_entity_year_rows'] == 0, src
          assert src['termination_date_conflict_groups'] >= 0, src
          assert canonical['duplicate_entity_year_rows'] == 0, canonical
          assert coverage['entities_searchable'] > 1_000_000, coverage
          assert quality['ownership_current']['rows'] > 100_000, quality['ownership_current']
          assert quality['names_current']['activity_start_date_coverage'] > 0.5, quality['names_current']
          print(json.dumps({'coverage':coverage,'company_year_source':src,'company_year':canonical,'ownership':quality['ownership_current'],'names':quality['names_current']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: radar-sii-v011-canonical-${{ github.run_id }}
          path: validation_output/
          retention-days: 30
