name: Maestro entidades públicas

on:
  workflow_dispatch:
  schedule:
    - cron: '10 13 15 * *'
  push:
    paths:
      - 'scripts/build_public_entity_registry.py'
      - 'src/radar_sii/public_registry.py'
      - 'src/radar_sii/public_analysis.py'
      - 'src/radar_sii/query_job.py'
      - 'src/radar_sii/pipeline.py'
      - 'src/radar_sii/fusion_contract.py'
      - 'tests/test_public_registry.py'
      - 'tests/test_public_analysis.py'
      - '.github/workflows/public-entities.yml'

permissions:
  contents: write

concurrency:
  group: radar-sii-public-entities
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Validate public-registry integration code
        run: pytest -q tests/test_public_registry.py tests/test_public_analysis.py

      - name: Download current SII legal names
        run: |
          python -m radar_sii.pipeline \
            --only sii_names_current \
            --workdir .public_registry \
            --output .public_registry_meta

      - name: Build public entity master
        run: |
          python scripts/build_public_entity_registry.py \
            --names-parquet .public_registry/silver/sii_names_current.parquet \
            --output config/public_entities_registry.csv \
            --summary docs/data/public_entities_summary.json

      - name: Validate public entity master
        run: |
          test -s config/public_entities_registry.csv
          test -s docs/data/public_entities_summary.json
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          s = json.loads(Path('docs/data/public_entities_summary.json').read_text(encoding='utf-8'))
          df = pd.read_csv('config/public_entities_registry.csv', sep=';', dtype=str).fillna('')
          assert s['public_entities_chilecompra'] >= 800
          assert s['public_entities_total'] >= s['public_entities_chilecompra']
          assert 120 <= s['public_services_gob_cl'] <= 250
          assert s['strict_public_services'] == s['public_services_gob_cl']
          assert len(df) == s['public_entities_total']
          assert set([
              'public_entity_id','official_name','is_public_entity','is_public_service_strict',
              'public_entity_type','chilecompra_reference_match','datos_gob_reference_match',
              'gob_cl_reference_match','dipres_reference_match','rut','entity_id'
          ]).issubset(df.columns)
          assert (df['is_public_entity'].str.lower() == 'true').all()
          assert df['public_entity_id'].nunique() == len(df)
          assert (df['is_public_service_strict'].str.lower() == 'true').sum() == s['strict_public_services']
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: public-entities-${{ github.run_id }}
          path: |
            config/public_entities_registry.csv
            docs/data/public_entities_summary.json
          retention-days: 30

      - name: Commit refreshed public entity master
        run: |
          git config user.name 'radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f config/public_entities_registry.csv docs/data/public_entities_summary.json
          if git diff --cached --quiet; then
            echo 'Sin cambios en maestro de entidades públicas.'
          else
            git commit -m 'data: actualiza maestro de entidades públicas'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
