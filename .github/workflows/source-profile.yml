name: Profile SII Sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profile official ZIP structures
        run: |
          python - <<'PY'
          import csv, json, urllib.request, zipfile
          from pathlib import Path

          urls = {
              'company_year': 'https://www.sii.cl/estadisticas/nominas/PUB_EMPRESAS_PJ_2020_A_2024.zip',
              'names': 'https://www.sii.cl/estadisticas/nominas/PUB_NOMBRES_PJ.zip',
              'activities': 'https://www.sii.cl/estadisticas/nominas/PUB_NOM_ACTECOS.zip',
              'addresses': 'https://www.sii.cl/estadisticas/nominas/PUB_NOM_DIRECCIONES.zip',
              'ownership': 'https://www.sii.cl/sobre_el_sii/composicion_sociedades.zip',
          }
          out = Path('source_profile')
          out.mkdir(exist_ok=True)
          report = {}
          for source_id, url in urls.items():
              path = out / f'{source_id}.zip'
              req = urllib.request.Request(url, headers={'User-Agent':'Radar-SII/0.1 source profiler'})
              with urllib.request.urlopen(req, timeout=240) as r, path.open('wb') as f:
                  while True:
                      chunk = r.read(1024*1024)
                      if not chunk: break
                      f.write(chunk)
              members=[]
              with zipfile.ZipFile(path) as zf:
                  for info in zf.infolist():
                      if info.is_dir(): continue
                      with zf.open(info) as fh:
                          raw=fh.read(200000)
                      encoding='utf-8-sig'
                      try: text=raw.decode(encoding)
                      except UnicodeDecodeError:
                          encoding='cp1252'
                          text=raw.decode(encoding, errors='replace')
                      lines=text.splitlines()
                      sample='\n'.join(lines[:3])
                      try:
                          sep=csv.Sniffer().sniff(sample, delimiters='\t;|,').delimiter
                      except Exception:
                          sep=max(('\t',';','|',','), key=lambda s: sample.count(s))
                      header=next(csv.reader([lines[0] if lines else ''], delimiter=sep), [])
                      members.append({
                          'name': info.filename,
                          'bytes': info.file_size,
                          'encoding': encoding,
                          'separator': repr(sep),
                          'header': header,
                          'sample_lines': lines[:3],
                      })
              report[source_id]={'url':url,'zip_bytes':path.stat().st_size,'members':members}
              path.unlink()
          (out/'source_profile.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          for sid, data in report.items():
              print('\n###',sid)
              for m in data['members']:
                  print(m['name'], m['bytes'])
                  print(m['header'])
                  print(m['sample_lines'][:2])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: radar-sii-source-profile-${{ github.run_id }}
          path: source_profile/source_profile.json
          retention-days: 30
