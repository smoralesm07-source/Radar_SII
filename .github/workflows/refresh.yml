name: Refresh Radar SII
on:
  workflow_dispatch:
  schedule:
    - cron: '40 11 12 * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radar-sii-refresh
  cancel-in-progress: false
jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt && python -m pip install -e .
      - name: Rebuild from official SII sources
        run: python -m radar_sii.pipeline --output docs/data
      - name: Build Fusion contract and source evidence
        run: python -c "from pathlib import Path; from radar_sii.fusion_contract import build_fusion_contract; print(build_fusion_contract(Path('.radar_sii/silver'), Path('docs/data')))"
      - name: Validate downloads, structure and publish KPIs
        run: python scripts/validate_publish.py docs/data
      - uses: actions/upload-artifact@v4
        with:
          name: radar-sii-metadata-${{ github.run_id }}
          path: docs/data/
          retention-days: 30
      - name: Publish metadata contract for Fusion release
        uses: actions/upload-artifact@v4
        with:
          name: radar-sii-bootstrap-${{ github.run_id }}
          path: docs/data/
          retention-days: 30
      - name: Publish governed native Parquet for Fusion Layer
        uses: actions/upload-artifact@v4
        with:
          name: radar-sii-fusion-parquet-${{ github.run_id }}
          path: |
            .radar_sii/silver/entity_search.parquet
            .radar_sii/silver/company_year_enriched.parquet
            .radar_sii/silver/sii_activities_current.parquet
            .radar_sii/silver/sii_addresses_history.parquet
            .radar_sii/silver/sii_ownership_current.parquet
            .radar_sii/silver/risk_signals.parquet
          if-no-files-found: error
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
