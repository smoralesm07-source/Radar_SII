name: Refresh Radar SII
on:
  workflow_dispatch:
  schedule:
    - cron: '40 11 12 * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radar-sii-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt && python -m pip install -e .
      - name: Rebuild from official SII sources
        run: python -m radar_sii.pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: radar-sii-metadata-${{ github.run_id }}
          path: docs/data/
          retention-days: 30
      - name: Configure Pages
        id: configure_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.configure_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        if: steps.configure_pages.outcome == 'success'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
