name: Bootstrap Radar SII
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'src/radar_sii/**'
      - 'config/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'docs/index.html'
      - 'scripts/validate_publish.py'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radar-sii-bootstrap
  cancel-in-progress: true
jobs:
  bootstrap:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt && python -m pip install -e .
      - name: Build full SII snapshot into Pages data
        run: python -m radar_sii.pipeline --output docs/data
      - name: Validate downloads, structure and publish KPIs
        run: python scripts/validate_publish.py docs/data
      - uses: actions/upload-artifact@v4
        with:
          name: radar-sii-bootstrap-${{ github.run_id }}
          path: docs/data/
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
