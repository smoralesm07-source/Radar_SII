name: Bootstrap Radar SII
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'src/radar_sii/**'
      - 'config/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'docs/index.html'
      - 'scripts/validate_publish.py'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radar-sii-bootstrap
  cancel-in-progress: true
jobs:
  bootstrap:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt && python -m pip install -e .
      - name: Build full SII snapshot into Pages data
        run: python -m radar_sii.pipeline --output docs/data
      - name: Build Fusion Layer contract and source evidence
        run: python -c "from pathlib import Path; from radar_sii.fusion_contract import build_fusion_contract; print(build_fusion_contract(Path('.radar_sii/silver'), Path('docs/data')))"
      - name: Validate downloads, structure and publish KPIs
        run: python scripts/validate_publish.py docs/data
      - uses: actions/upload-artifact@v4
        with:
          name: radar-sii-bootstrap-${{ github.run_id }}
          path: docs/data/
          retention-days: 30
      - name: Publish governed native Parquet for Fusion Layer
        uses: actions/upload-artifact@v4
        with:
          name: radar-sii-fusion-parquet-${{ github.run_id }}
          path: |
            .radar_sii/silver/entity_search.parquet
            .radar_sii/silver/company_year_enriched.parquet
            .radar_sii/silver/sii_activities_current.parquet
            .radar_sii/silver/sii_addresses_history.parquet
            .radar_sii/silver/sii_ownership_current.parquet
            .radar_sii/silver/risk_signals.parquet
          if-no-files-found: error
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
