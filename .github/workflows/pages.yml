name: Deploy checked snapshot
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/validate_publish.py'
      - 'scripts/build_tax_history_pages.py'
  workflow_run:
    workflows: ["Publish IPA3 SII history"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install longitudinal build dependency
        run: python -m pip install 'duckdb>=1.3,<2'
      - name: Build compact SII tax history for Entity 360
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 3 \
            -o /tmp/radar-sii-ipa3-history.parquet \
            https://github.com/smoralesm07-source/Radar_SII/releases/download/fusion-v1/radar-sii-ipa3-history.parquet
          curl -L --fail --retry 4 --retry-delay 3 \
            -o /tmp/radar-sii-ipa3-history-manifest.json \
            https://github.com/smoralesm07-source/Radar_SII/releases/download/fusion-v1/radar-sii-ipa3-history-manifest.json
          python scripts/build_tax_history_pages.py \
            /tmp/radar-sii-ipa3-history.parquet \
            docs/data/tax-history \
            /tmp/radar-sii-ipa3-history-manifest.json
      - name: Validate checked snapshot before publish
        run: python scripts/validate_publish.py docs/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
