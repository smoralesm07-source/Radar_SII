name: Search Radar SII
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'entities | history | activities | addresses | ownership | signals | public_entities'
        required: true
        default: entities
      text:
        description: 'Texto libre (razón social, giro, territorio, entidad pública, sociedad, socio PJ, etc.)'
        required: false
        default: ''
      filters_json:
        description: 'Filtros JSON, ej. {"rut":"76086428-5"} o {"is_public_entity":true}'
        required: false
        default: '{}'
      limit:
        description: 'Máximo de filas (1-100000)'
        required: true
        default: '1000'
  push:
    branches: [main]
    paths:
      - '.github/workflows/search.yml'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt && python -m pip install -e .
      - name: Build and query Radar SII
        env:
          RADAR_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'history' }}
          RADAR_TEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.text || '' }}
          RADAR_FILTERS: ${{ github.event_name == 'workflow_dispatch' && inputs.filters_json || '{"rut":"76112852-3"}' }}
          RADAR_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '100' }}
        run: >-
          python -m radar_sii.query_job
          --scope "$RADAR_SCOPE"
          --text "$RADAR_TEXT"
          --filters-json "$RADAR_FILTERS"
          --limit "$RADAR_LIMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: radar-sii-search-${{ github.run_id }}
          path: query_result/
          retention-days: 14
