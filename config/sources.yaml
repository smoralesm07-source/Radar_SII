    chunksize: 100000
  - id: sii_names_current
    kind: names
    description: "Razón social, inicio de actividades y término de giro de personas jurídicas"
    url: "https://www.sii.cl/estadisticas/nominas/PUB_NOMBRES_PJ.zip"
    official_page: "https://www.sii.cl/sobre_el_sii/nominapersonasjuridicas.html"
    published_update: "2026-08"
    coverage: "snapshot actual"
    member_globs:
      - "PUB_NOMBRES_PJ.txt"
    chunksize: 150000
  - id: sii_activities_current
    kind: activities
    description: "Actividades económicas inscritas y vigentes de personas jurídicas"
    url: "https://www.sii.cl/estadisticas/nominas/PUB_NOM_ACTECOS.zip"
    official_page: "https://www.sii.cl/sobre_el_sii/nominapersonasjuridicas.html"
    published_update: "2026-08"
    coverage: "snapshot actual"
    member_globs:
      - "PUB_NOM_ACTECOS.txt"
    chunksize: 150000
  - id: sii_addresses_history
    kind: addresses
    description: "Direcciones históricas, casa matriz y sucursales, vigentes y no vigentes"
    url: "https://www.sii.cl/estadisticas/nominas/PUB_NOM_DIRECCIONES.zip"
    official_page: "https://www.sii.cl/sobre_el_sii/nominapersonasjuridicas.html"
